name: Controlling execution flow
description: Controlling execution flows

on:
    push:
    workflow_dispatch:
      inputs:
        dry-run:
          type: boolean
          description: Skip deployment and only print build output
          default: false

        target:
          type: environment
          description: Which envirnoment the wf will target
          required: true
        
        tag:
          type: choice
          options:
            - v1
            - v2
          default: v2
          description: Release from which to build and deploy

jobs:

  dev-bulid:
    runs-on: ubuntu-latest
    steps:
      - name: bulid dev
        run: echo 'building dev ${{ inputs.tag }}'

  dev-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy in dev
        run: echo 'deploy dev ${{ inputs.target }}'




