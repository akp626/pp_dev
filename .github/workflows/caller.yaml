name: Caller workflow
description: Define caller workflows

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable.yaml
    with:
        target-directory: dummy-dir
    
  print-outputs:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
        - name: Print Outputs
          run: |
            echo "Build status: ${{ needs.deploy.outputs.build_status }}"
        

