name: Custom action
description: Use custom actions

on:
    workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node and NPM Dependencies
        uses: ./.github/actions/custon-actions
        with:
          nde-version: 20.x
          working-dir: custom-actions/app
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        working-directory: custom-actions/app




