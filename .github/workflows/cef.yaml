name: Controlling execution flow
description: Controlling execution flows

on:
    push:
    workflow_dispatch:

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - name: deploy in dev
        run: echo 'Im in dev'
  
  uat:
    runs-on: ubuntu-latest
    needs: dev
    steps:
      - name: deploy in UAT
        run: echo 'Im in UAT'

  prod:
    runs-on: ubuntu-latest
    needs:
      - dev
      - uat
    steps:
      - name: deploy in PROD
        run: echo 'Im in PROD'


