name: Outputs
description: Explore outputs

on:
    push:
    workflow_dispatch:

jobs:

  dev-build:
    runs-on: ubuntu-latest
    outputs:
        tenant-env: ${{ steps.build.outputs.tenant }}
    steps:
      - name: bulid tenant
        id: build
        run: echo 'tenant=dev' >> $GITHUB_OUTPUT
      - name: print tenant
        run: echo 'print tenant:${{ steps.build.outputs.tenant }}'

  dev-deploy:
    runs-on: ubuntu-latest
    needs: dev-build
    steps:
      - name: deploy in dev
        if: ${{ needs.dev-build.outputs.tenant-env == 'dev' }}
        run: echo 'deploy in ${{ needs.dev-build.outputs.tenant-env }}'


